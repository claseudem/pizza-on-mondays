[project]
name = "moainvest"
version = "0.1.0"
description = "Dashboard en Streamlit para explorar activos financieros con datos en vivo de Yahoo Finance"
readme = "README.md"
authors = [
    { name = "claseudem", email = "164520182+claseudem@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.8.4",
    "quantstats>=0.0.81",
    "seaborn>=0.13.2",
    "streamlit>=1.63.0",
    "yfinance>=1.7.0",
]

[project.scripts]
moainvest = "pizza_on_mondays:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pizza_on_mondays"
